name: Publish Package

on:
  push:
    tags:
      - "v*"

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing via OIDC

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"

          if [ "$GITHUB_REF_NAME" != "$PACKAGE_VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish
