name: First Interaction

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome first-time contributors
        uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue in MCP Failure Lab! 👋

            I’ll take a look when I can. If you have any additional context, reproduction steps, or ideas, feel free to add them here.

            Thanks for helping improve the project! 🚀
          pr-message: |
            Thanks for opening your first pull request to MCP Failure Lab! 👋

            CI will run automatically to check your changes. If anything fails or looks confusing, feel free to ask here.

            I’ll review it when I can and may leave feedback or suggestions.

            Thanks for contributing! 🚀
