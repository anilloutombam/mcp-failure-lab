name: Bug report
description: Report a reproducible problem in MCP Failure Lab
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials, MCP Inspector tokens, or private protocol data.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests for this problem.
          required: true
        - label: I can reproduce this using the latest version from `main`.
          required: true
        - label: This report does not contain secrets or sensitive data.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what went wrong and which fault tool or command was involved.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic sequence that reproduces the problem.
      placeholder: |
        1. Start the server with ...
        2. Connect using ...
        3. Call the tool with ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the observable error, timeout, cancellation, or cleanup behavior.
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - In-memory test transport
        - Streamable HTTP
        - Not sure
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MCP Failure Lab version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 22.19.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Remove secrets, tokens, usernames, and machine-specific paths before posting.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add anything else that may help reproduce or understand the problem.
